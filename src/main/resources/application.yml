spring:
  application:
    name: error-free-text
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/error_free_text}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  speller:
    base-url: ${SPELLER_URL:https://speller.yandex.net/services/spellservice.json}
    max-text-length: 10000
    connect-timeout: 5s
    read-timeout: 30s
  scheduler:
    delay: ${SCHEDULER_DELAY_MS:10000}
    batch-size: ${SCHEDULER_BATCH_SIZE:10}

logging:
  level:
    com.dirinekyan.eft: INFO
