services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: error_free_text
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d error_free_text"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/error_free_text
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SCHEDULER_DELAY_MS: 5000
    ports:
      - "8080:8080"
